<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="900" height="220" fill="#0d1117"/>
  <rect x="0" y="0" width="900" height="220" fill="none" stroke="#1f2937" stroke-width="1"/>

  <!-- grid lines -->
  <g stroke="#161b22" stroke-width="1">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
  </g>

  <!-- scrolling ticker tape at top -->
  <g font-family="JetBrains Mono, monospace" font-size="13" fill="#2dd4bf">
    <text x="0" y="20">
      <animate attributeName="x" from="900" to="-1600" dur="16s" repeatCount="indefinite"/>
      SHADAB +2.40%&#160;&#160;&#160;&#160; NODEJS ▲&#160;&#160;&#160;&#160; PYTHON ▲&#160;&#160;&#160;&#160; REACT ▲&#160;&#160;&#160;&#160; ALGOKAMAI +18.6%&#160;&#160;&#160;&#160; UPTIME 99.9%&#160;&#160;&#160;&#160; VAKEEL.AI ▲&#160;&#160;&#160;&#160; COFFEE -100%&#160;&#160;&#160;&#160; SHADAB +2.40%&#160;&#160;&#160;&#160; NODEJS ▲&#160;&#160;&#160;&#160; PYTHON ▲&#160;&#160;&#160;&#160; REACT ▲&#160;&#160;&#160;&#160; ALGOKAMAI +18.6%&#160;&#160;&#160;&#160; UPTIME 99.9%&#160;&#160;&#160;&#160; VAKEEL.AI ▲
    </text>
  </g>
  <line x1="0" y1="30" x2="900" y2="30" stroke="#1f2937" stroke-width="1"/>

  <!-- animated candlesticks -->
  <g font-family="JetBrains Mono, monospace">
    <!-- candle 1 (green) -->
    <line x1="60" y1="70" x2="60" y2="150" stroke="#22c55e" stroke-width="2"/>
    <rect x="52" y="90" width="16" height="40" fill="#22c55e">
      <animate attributeName="y" values="90;80;90;100;90" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="height" values="40;55;40;30;40" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- candle 2 (red) -->
    <line x1="110" y1="60" x2="110" y2="140" stroke="#ef4444" stroke-width="2"/>
    <rect x="102" y="75" width="16" height="35" fill="#ef4444">
      <animate attributeName="y" values="75;90;75;65;75" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="height" values="35;25;35;45;35" dur="3.5s" repeatCount="indefinite"/>
    </rect>

    <!-- candle 3 (green) -->
    <line x1="160" y1="50" x2="160" y2="150" stroke="#22c55e" stroke-width="2"/>
    <rect x="152" y="70" width="16" height="50" fill="#22c55e">
      <animate attributeName="y" values="70;55;70;85;70" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="height" values="50;65;50;35;50" dur="4.5s" repeatCount="indefinite"/>
    </rect>

    <!-- candle 4 (red) -->
    <line x1="210" y1="65" x2="210" y2="145" stroke="#ef4444" stroke-width="2"/>
    <rect x="202" y="85" width="16" height="38" fill="#ef4444">
      <animate attributeName="y" values="85;100;85;70;85" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="height" values="38;28;38;48;38" dur="3.8s" repeatCount="indefinite"/>
    </rect>

    <!-- candle 5 (green) -->
    <line x1="260" y1="45" x2="260" y2="140" stroke="#22c55e" stroke-width="2"/>
    <rect x="252" y="60" width="16" height="55" fill="#22c55e">
      <animate attributeName="y" values="60;45;60;75;60" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="height" values="55;70;55;40;55" dur="4.2s" repeatCount="indefinite"/>
    </rect>

    <!-- candle 6 (green) -->
    <line x1="310" y1="40" x2="310" y2="130" stroke="#22c55e" stroke-width="2"/>
    <rect x="302" y="55" width="16" height="50" fill="#22c55e">
      <animate attributeName="y" values="55;40;55;65;55" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="height" values="50;65;50;35;50" dur="3.6s" repeatCount="indefinite"/>
    </rect>

    <!-- candle 7 (red) -->
    <line x1="360" y1="55" x2="360" y2="135" stroke="#ef4444" stroke-width="2"/>
    <rect x="352" y="70" width="16" height="40" fill="#ef4444">
      <animate attributeName="y" values="70;85;70;60;70" dur="4.1s" repeatCount="indefinite"/>
      <animate attributeName="height" values="40;30;40;50;40" dur="4.1s" repeatCount="indefinite"/>
    </rect>

    <!-- candle 8 (green) -->
    <line x1="410" y1="35" x2="410" y2="125" stroke="#22c55e" stroke-width="2"/>
    <rect x="402" y="50" width="16" height="45" fill="#22c55e">
      <animate attributeName="y" values="50;35;50;60;50" dur="3.9s" repeatCount="indefinite"/>
      <animate attributeName="height" values="45;60;45;30;45" dur="3.9s" repeatCount="indefinite"/>
    </rect>

    <!-- rising trend line -->
    <path d="M 60,110 L 110,95 L 160,80 L 210,90 L 260,70 L 310,55 L 360,65 L 410,45"
          fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
  </g>

  <!-- terminal readout -->
  <g font-family="JetBrains Mono, monospace" font-size="15" fill="#2dd4bf">
    <text x="460" y="90">root@CODEMRKMS:~$ run build.sh</text>
    <text x="460" y="115">&gt; compiling systems<tspan fill="#22c55e"> [OK]</tspan></text>
    <text x="460" y="140">&gt; deploying to production<tspan fill="#22c55e"> [OK]</tspan></text>
    <text x="460" y="165" fill="#e5e7eb">&gt; watching market data...
      <tspan fill="#2dd4bf">_</tspan>
    </text>
    <rect x="686" y="153" width="9" height="14" fill="#2dd4bf">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.4;0.9;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- baseline -->
  <line x1="0" y1="160" x2="900" y2="160" stroke="#1f2937" stroke-width="1"/>
  <g font-family="JetBrains Mono, monospace" font-size="12" fill="#6b7280">
    <text x="20" y="200">MOHAMMAD SHADAB · FULL-STACK &amp; TRADING SYSTEMS</text>
    <text x="770" y="200" fill="#22c55e">● LIVE</text>
  </g>
</svg>
